services:
  postgres:
    image: postgres:16
    container_name: blog-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blog_platform
    ports:
      - '5432:5432'
    volumes:
      - blog_platform_postgres_data:/var/lib/postgresql/data

volumes:
  blog_platform_postgres_data:
