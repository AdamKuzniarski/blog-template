services:
  postgres:
    image: postgres:16
    container_name: blog-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blog_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-blog_platform}
    ports:
      - '5432:5432'
    volumes:
      - blog_platform_postgres_data:/var/lib/postgresql/data

volumes:
  blog_platform_postgres_data:
